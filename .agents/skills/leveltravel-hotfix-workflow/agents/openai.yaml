interface:
  display_name: "LevelTravel Hotfix Workflow"
  short_description: "Create paired hotfix PRs with Tracker"
  default_prompt: "Use $leveltravel-hotfix-workflow to create or reuse one Tracker task, create paired master and develop hotfix branches, cherry-pick the master commit, and open both PRs with HOTFIX titles."

policy:
  allow_implicit_invocation: true
